[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-customer-revenue-analytics"
version = "0.1.0"
description = "Customer, retention and revenue analytics on synthetic e-commerce data (portfolio project)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "jupyterlab>=4.0",
    "nbformat>=5.10",
]
bi = ["xlsxwriter>=3.2"]

[project.scripts]
novacart-generate = "novacart.synthetic.cli:main"
novacart-load = "novacart.ingestion.cli:main"
novacart-build-analytics = "novacart.warehouse:build_main"
novacart-reconcile = "novacart.warehouse:reconcile_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: requires a running PostgreSQL instance (set NOVACART_RUN_DB_TESTS=1)",
    "slow: full-scale generation rather than the reduced test dataset",
]

[tool.ruff]
line-length = 100
target-version = "py312"

