name: novacart

services:
  postgres:
    image: postgres:16-alpine
    container_name: novacart-postgres
    restart: unless-stopped
    # Analytical queries use parallel workers; the Docker default of 64 MB shared
    # memory is too small for the reconciliation and mart queries.
    shm_size: 512mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      TZ: ${POSTGRES_TZ:-UTC}
      PGTZ: ${POSTGRES_TZ:-UTC}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: novacart_postgres_data

